[pytest]
testpaths = tests
; venv ini pakai --system-site-packages, jadi plugin pytest11 punya ROS2 (launch_testing,
; ament_*) ikut ke-scan pytest walau tidak ada hubungannya sama proyek ini. launch_testing
; sendiri gagal di-import (butuh paket 'lark' yang tidak terpasang) dan bikin pytest
; langsung crash sebelum sempat jalanin test manapun - dimatikan spesifik di sini biar
; `pytest` polos jalan tanpa perlu contributor lain tahu/set PYTEST_DISABLE_PLUGIN_AUTOLOAD.
addopts = -p no:launch_testing
